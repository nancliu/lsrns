<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时序数据图表展示 - 交通仿真系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-group label {
            font-weight: 500;
            color: #333;
        }

        select, input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 8px 16px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s;
        }

        button:hover {
            background: #1976d2;
        }

        .status {
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .chart-card h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 16px;
        }

        canvas {
            max-height: 400px;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 2px;
        }

        .info-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }

        .info-box h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .info-box p {
            color: #666;
            line-height: 1.6;
            font-size: 14px;
        }

        .color-no-control { background: #ff6b6b; }
        .color-tec { background: #4ecdc4; }
        .color-vss { background: #45b7d1; }
        .color-dhs { background: #f9a825; }
    </style>
</head>
<body>
    <div class="container">
        <h1>策略对比时序数据可视化</h1>
        <p class="subtitle">展示4个控制策略在仿真过程中的8个交通性能指标变化趋势</p>

        <div class="controls">
            <div class="control-group">
                <label>案例ID:</label>
                <input type="text" id="caseIdInput" value="case_event_6120705" placeholder="输入案例ID">
            </div>
            <button onclick="loadTimeseriesData()">加载时序数据</button>
            <div id="statusMessage" class="status" style="display:none;"></div>
        </div>

        <div class="info-box">
            <h3>时序数据说明</h3>
            <p>
                时序数据从每个仿真的summary.xml中提取，记录整个仿真过程中的关键指标变化。
                每条线代表一个控制策略，展示其在仿真过程中的性能表现。
                可用于分析策略的实时效果和性能稳定性。
            </p>
        </div>

        <div class="charts-grid" id="chartsContainer">
            <div class="chart-card">
                <h3>当前运行车数 (辆)</h3>
                <canvas id="currentVehiclesChart"></canvas>
                <div class="legend">
                    <div class="legend-item">
                        <span class="legend-color color-no-control"></span>
                        <span>NO_CONTROL (基准)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color color-tec"></span>
                        <span>TEC (收费站管控)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color color-vss"></span>
                        <span>VSS (可变限速)</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color color-dhs"></span>
                        <span>DHS (动态硬路肩)</span>
                    </div>
                </div>
            </div>

            <div class="chart-card">
                <h3>平均速度 (km/h)</h3>
                <canvas id="avgSpeedChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>已载入车数 (辆)</h3>
                <canvas id="loadedVehiclesChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>等待车数 (辆)</h3>
                <canvas id="waitingVehiclesChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>已完成车数 (辆)</h3>
                <canvas id="completedVehiclesChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const apiBase = '/api/v1';
        const strategyColors = {
            'NO_CONTROL': '#ff6b6b',
            'TEC': '#4ecdc4',
            'VSS': '#45b7d1',
            'DHS': '#f9a825'
        };

        const strategyLabels = {
            'NO_CONTROL': '无控制（基准）',
            'TEC': '收费站管控',
            'VSS': '可变限速',
            'DHS': '动态硬路肩'
        };

        let charts = {};

        function setStatus(message, type = 'loading') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }

        async function loadTimeseriesData() {
            const caseId = document.getElementById('caseIdInput').value;
            if (!caseId) {
                setStatus('请输入案例ID', 'error');
                return;
            }

            setStatus('正在加载时序数据...', 'loading');

            try {
                const response = await fetch(`${apiBase}/analysis/strategy-timeseries/${caseId}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const wrapper = await response.json();
                const timeseriesData = wrapper.data || wrapper;

                setStatus(`✓ 加载成功！`, 'success');
                renderCharts(timeseriesData);
            } catch (error) {
                setStatus(`✗ 加载失败: ${error.message}`, 'error');
                console.error(error);
            }
        }

        function renderCharts(timeseriesData) {
            // 当前运行车数
            renderChart('currentVehiclesChart', '当前运行车数 (辆)', timeseriesData, 'current_vehicles');

            // 平均速度
            renderChart('avgSpeedChart', '平均速度 (km/h)', timeseriesData, 'avg_speed');

            // 已载入车数
            renderChart('loadedVehiclesChart', '已载入车数 (辆)', timeseriesData, 'loaded_vehicles');

            // 等待车数
            renderChart('waitingVehiclesChart', '等待车数 (辆)', timeseriesData, 'waiting_vehicles');

            // 已完成车数
            renderChart('completedVehiclesChart', '已完成车数 (辆)', timeseriesData, 'completed_vehicles');
        }

        function renderChart(canvasId, title, timeseriesData, metricKey) {
            const ctx = document.getElementById(canvasId).getContext('2d');

            // 销毁已有的图表
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }

            // 准备数据集
            const datasets = [];
            const strategies = ['NO_CONTROL', 'TEC', 'VSS', 'DHS'];

            strategies.forEach(strategy => {
                if (timeseriesData[strategy] && timeseriesData[strategy][metricKey]) {
                    const data = timeseriesData[strategy][metricKey];

                    datasets.push({
                        label: strategyLabels[strategy],
                        data: data.map(point => ({
                            x: point.time,
                            y: point.value
                        })),
                        borderColor: strategyColors[strategy],
                        backgroundColor: strategyColors[strategy] + '15',
                        tension: 0.4,
                        borderWidth: 2,
                        fill: false,
                        pointRadius: 0,
                        pointHoverRadius: 6
                    });
                }
            });

            // 创建图表
            charts[canvasId] = new Chart(ctx, {
                type: 'scatter',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: '仿真时间 (秒)'
                            },
                            min: 0
                        },
                        y: {
                            title: {
                                display: true,
                                text: title
                            },
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // 页面加载时自动加载数据
        window.addEventListener('load', () => {
            loadTimeseriesData();
        });
    </script>
</body>
</html>
