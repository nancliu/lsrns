        /**
         * 确认批量启动仿真
         */
        window.confirmBulkStartSimulation = async function(caseIdString) {
            const selectedCases = caseIdString.split(',');
            closeBulkConfirmModal();

            try {
                // 显示加载指示器
                const bulkActionsArea = document.getElementById('bulkActionsArea');
                const originalContent = bulkActionsArea.innerHTML;
                bulkActionsArea.innerHTML = '<div style="text-align: center; padding: 10px; color: #1976d2;">启动中...</div>';

                // 从缓存中获取所有选中案例的simulations
                const firstCaseId = selectedCases[0];
                const simulationIds = [];

                // 遍历所有选中的案例，收集所有simulations
                for (const caseId of selectedCases) {
                    const caseItem = caseDataMap[caseId];
                    if (!caseItem) {
                        console.warn(`找不到案例数据: ${caseId}`);
                        continue;
                    }

                    // 提取该案例的simulation_ids
                    if (caseItem.simulations && typeof caseItem.simulations === 'object') {
                        simulationIds.push(...Object.keys(caseItem.simulations));
                    }
                }

                if (simulationIds.length === 0) {
                    throw new Error('所有案例中都没有仿真');
                }

                // 调用batch-start API
                const response = await api.request('/simulation/batch-start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        simulation_ids: simulationIds,
                        case_id: firstCaseId,
                        parallel_workers: 4,
                        auto_run_analysis: true
                    })
                });

                console.log('批量启动完整响应:', response);
                console.log('response.data:', response.data);

                // 获取batch_id - 检查多个位置
                let newBatchId = response.batch_id;
                if (!newBatchId && response.data) {
                    newBatchId = response.data.batch_id;
                }
                console.log('最终提取的batch_id:', newBatchId);

                if (newBatchId) {
                    // 设置全局batchId
                    batchId = newBatchId;

                    // 保存所有选中的case_ids - 支持多个事件的并行监控
                    if (selectedCases.length > 0) {
                        window.currentMonitoringCaseIds = selectedCases;  // 保存所有选中的案例
                        window.currentMonitoringCaseId = selectedCases[0];  // 保留兼容性，主要ID为第一个
                    }

                    // 保存批次信息到sessionStorage（包括scenarioId和所有caseIds）
                    saveBatchInfo(batchId, window.currentMonitoringCaseId, scenarioId);
                    sessionStorage.setItem('currentMonitoringCaseIds', JSON.stringify(selectedCases));

                    // 隐藏案例列表，显示监测面板
                    clearSelection();
                    showMonitoringPanel();

                    // 刷新监测数据
                    refreshMonitoringPanel();
                } else {
                    throw new Error('未获取到batch_id');
                }

            } catch (error) {
                console.error('批量启动失败:', error);
                alert(`启动失败: ${error.message}`);
                const bulkActionsArea = document.getElementById('bulkActionsArea');
                bulkActionsArea.innerHTML = originalContent;
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            // 添加搜索框事件监听（防抖）
            const searchBox = document.getElementById('searchCases');
            if (searchBox) {
                let searchTimeout;
                searchBox.addEventListener('input', () => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        applyFilters();
                    }, 500);
                });
            }

            // 初始化界面
            // 首先恢复之前保存的批次信息
            restoreBatchInfo();

            console.log('页面初始化 - caseId:', caseId, 'batchId:', batchId);

            // 总是显示案例列表
            currentTab = 'cases';
            const casesTab = document.getElementById('cases-tab');
            if (casesTab) casesTab.style.display = 'block';

            // 加载初始数据
            updateCaseStats();
            await loadCases();  // 等待案例加载完成

            // 如果URL中有 case_event_id 或 caseId，在加载后自动选择该案例
            if (caseId) {
                console.log('URL参数中指定了案例ID:', caseId);
                // 再等待一次确保DOM更新
                await new Promise(resolve => setTimeout(resolve, 100));

                // 查找对应的复选框（通过value属性）
                const caseCheckbox = document.querySelector(`input.case-checkbox[value="${caseId}"]`);
                if (caseCheckbox) {
                    caseCheckbox.checked = true;
                    // 触发选择事件来更新UI
                    updateBulkActionState();
                    console.log('✓ 已自动选择案例:', caseId);
                } else {
                    console.warn('✗ 未找到案例复选框，caseId:', caseId);
                    console.log('可用的案例复选框:', document.querySelectorAll('input.case-checkbox').length);
                }
            }

            // 根据URL参数或恢复的batchId决定是否显示监控面板
            const activeTab = new URLSearchParams(window.location.search).get('activeTab') || 'cases';
            if (activeTab === 'monitor' || batchId) {
                showMonitoringPanel();
            }
        });

        // 页面卸载时清理监控
        window.addEventListener('beforeunload', () => {
            stopMonitoring();
        });

        // 页面隐藏时暂停监控
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopMonitoring();
            } else if (currentTab === 'monitor') {
                startMonitoring();
            }
        });
    
        // ===== 展开/折叠监控面板函数 =====
        
        /**
         * 切换监控面板的展开/折叠状态
         */
        function toggleMonitoring() {
            const collapsedContent = document.getElementById('collapsedContent');
            const expandedContent = document.getElementById('expandedContent');
            const toggleBtn = document.getElementById('toggleMonitoringBtn');
            const toggleIcon = toggleBtn.querySelector('.toggle-icon');
            
            if (!collapsedContent || !expandedContent) {
                console.error('监控面板元素未找到');
                return;
            }
            
            // 切换可见性
            const isExpanded = expandedContent.style.display !== 'none' && 
                              expandedContent.classList.contains('visible');
            
            if (isExpanded) {
                // 折叠
                collapsedContent.style.display = 'block';
                collapsedContent.classList.remove('hidden');
                expandedContent.style.display = 'none';
                expandedContent.classList.remove('visible');
                toggleIcon.classList.remove('expanded');
            } else {
                // 展开
                collapsedContent.style.display = 'none';
                collapsedContent.classList.add('hidden');
                expandedContent.style.display = 'block';
                expandedContent.classList.add('visible');
                toggleIcon.classList.add('expanded');
            }
            
            // 保存用户偏好
            localStorage.setItem('monitoringPanelExpanded', !isExpanded ? 'true' : 'false');
            
            // 更新刷新频率
            updateRefreshRate();
        }
        
        /**
         * 根据展开/折叠状态更新刷新频率
         * 展开时: 5-10秒
         * 折叠时: 30秒
         */
        function updateRefreshRate() {
            const expandedContent = document.getElementById('expandedContent');
            const isExpanded = expandedContent && expandedContent.classList.contains('visible');

            // 停止当前监控
            stopMonitoring();

            // 重新启动监控（带新的刷新频率）
            if (currentTab === 'monitor') {
                const interval = isExpanded ? 7000 : 30000;
                monitoringInterval = setInterval(refreshBatchStatus, interval);
            }
        }
        
        /**
         * 手动刷新监控数据
         */
        function refreshMonitoring() {
            const refreshBtn = document.querySelector('.btn-refresh');
            if (refreshBtn) {
                refreshBtn.style.opacity = '0.5';
                refreshBtn.disabled = true;
            }

            // 立即刷新监控数据
            if (currentTab === 'monitor') {
                refreshBatchStatus();
            }

            // 恢复按钮状态（300ms后）
            setTimeout(() => {
                if (refreshBtn) {
                    refreshBtn.style.opacity = '1';
                    refreshBtn.disabled = false;
                }
            }, 300);
        }
        
        /**
         * 搜索和筛选仿真表格
         */
        function filterSimulations() {
            const searchInput = document.getElementById('simSearchInput');
            const tableBody = document.getElementById('simTableBody');
            
            if (!searchInput || !tableBody) {
                console.error('搜索或表格元素未找到');
                return;
            }
            
            const searchTerm = searchInput.value.toLowerCase().trim();
            const rows = tableBody.querySelectorAll('tr');
            let visibleCount = 0;
            
            rows.forEach(row => {
                if (row.cells.length < 2) return; // 跳过信息行
                
                const simId = row.cells[0]?.textContent?.toLowerCase() || '';
                const caseId = row.cells[1]?.textContent?.toLowerCase() || '';
                const status = row.cells[2]?.textContent?.toLowerCase() || '';
                
                // 匹配搜索词
                const matches = !searchTerm || 
                               simId.includes(searchTerm) || 
                               caseId.includes(searchTerm) || 
                               status.includes(searchTerm);
                
                if (matches) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });
            
            // 如果没有匹配结果，显示提示信息
            if (visibleCount === 0 && searchTerm) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #999; padding: 20px;">
                    没有找到匹配的仿真: "${searchTerm}"
                </td></tr>`;
            }
        }

        /**
         * Update case selection tracking when a checkbox changes
         */
        function updateCaseSelection() {
            const checkboxes = document.querySelectorAll('.case-checkbox:checked');
            selectedCases.clear();
            checkboxes.forEach(checkbox => {
                const caseId = checkbox.getAttribute('data-case-id');
                if (caseId) {
                    selectedCases.add(caseId);
                }
            });

            // Update "View Analysis" button visibility
            const viewAnalysisBtn = document.getElementById('viewAnalysisBtn');
            if (viewAnalysisBtn) {
                if (selectedCases.size > 0) {
                    viewAnalysisBtn.style.display = 'inline-block';
                } else {
                    viewAnalysisBtn.style.display = 'none';
                }
            }

            // Update "Select All" checkbox state
            const allCheckboxes = document.querySelectorAll('.case-checkbox');
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (selectAllCheckbox) {
                selectAllCheckbox.checked = allCheckboxes.length > 0 && allCheckboxes.length === checkboxes.length;
            }
        }

        /**
         * Toggle select all checkboxes in the table
         */
        function toggleSelectAll() {
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            const allCheckboxes = document.querySelectorAll('.case-checkbox');

            allCheckboxes.forEach(checkbox => {
                checkbox.checked = selectAllCheckbox.checked;
            });

            updateCaseSelection();
        }

        /**
         * Navigate to analysis viewer with selected cases
         */
        function viewAnalysisResults() {
            if (selectedCases.size === 0) {
                alert('请先选择至少一个案例');
                return;
            }

            const caseIds = Array.from(selectedCases);

            if (caseIds.length === 1) {
                // Single case - direct navigation with case_id parameter
                window.location.href = `analysis_viewer.html?case_id=${caseIds[0]}`;
            } else {
                // Multi-case comparison - navigate with case_ids parameter
                const caseIdsParam = caseIds.join(',');
                window.location.href = `analysis_viewer.html?case_ids=${caseIdsParam}`;
            }
        }

        /**
         * 初始化监控面板的展开/折叠状态
         */
        function initMonitoringPanel() {
            const collapsedContent = document.getElementById('collapsedContent');
            const expandedContent = document.getElementById('expandedContent');
            
            if (!collapsedContent || !expandedContent) return;
            
            // 从localStorage恢复用户之前的偏好
            const wasExpanded = localStorage.getItem('monitoringPanelExpanded') === 'true';
            
            if (wasExpanded) {
                // 恢复展开状态
                collapsedContent.style.display = 'none';
                collapsedContent.classList.add('hidden');
                expandedContent.style.display = 'block';
                expandedContent.classList.add('visible');
                
                const toggleIcon = document.querySelector('.toggle-icon');
                if (toggleIcon) {
                    toggleIcon.classList.add('expanded');
                }
            }
            
            // 设置初始刷新频率
            updateRefreshRate();
        }
        
        // 页面加载时初始化监控面板
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMonitoringPanel);
        } else {
            initMonitoringPanel();
        }

    </script>
</body>
</html>
