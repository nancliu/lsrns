<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影响分析 - 交通仿真推演系统</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="scenario_browser.css">
    <link rel="stylesheet" href="css/event-scenario-comparison.css">
    <style>
        .analysis-tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #ddd;
            margin-bottom: 20px;
        }

        .analysis-tab {
            padding: 12px 20px;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .analysis-tab.active {
            color: #1976d2;
            border-bottom-color: #1976d2;
        }

        .analysis-content {
            display: none;
        }

        .analysis-content.active {
            display: block;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #1976d2;
        }

        .metric-card.positive {
            border-left-color: #4caf50;
        }

        .metric-card.negative {
            border-left-color: #f44336;
        }

        .metric-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .metric-change {
            font-size: 12px;
            margin-top: 8px;
            color: #666;
        }

        .metric-change.positive {
            color: #4caf50;
        }

        .metric-change.negative {
            color: #f44336;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .comparison-table th {
            background-color: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }

        .comparison-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .comparison-table tr:hover {
            background-color: #f9f9f9;
        }

        .chart-container {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            min-height: 300px;
        }

        .edge-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .edge-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .edge-item:last-child {
            border-bottom: none;
        }

        .edge-name {
            flex: 1;
        }

        .edge-bar {
            flex: 1;
            height: 20px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 0 15px;
        }

        .edge-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4081, #ff6e40);
            transition: width 0.3s ease;
        }

        .edge-value {
            width: 60px;
            text-align: right;
            font-weight: 600;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .improvement-arrow {
            display: inline-block;
            margin-left: 8px;
        }

        .arrow-up {
            color: #4caf50;
        }

        .arrow-down {
            color: #f44336;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: #e0e0e0;
            color: #333;
        }

        .badge.positive {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .badge.negative {
            background: #ffcdd2;
            color: #c62828;
        }
    </style>
</head>
<body>
    <!-- 顶栏 -->
    <div class="top-bar">
        <div class="top-bar-left">
            <h1 class="system-title">超大规模路网仿真推演系统</h1>
        </div>
        <div class="top-bar-center">
            <h2 class="page-title">📈 影响分析</h2>
        </div>
        <div class="top-bar-buttons">
        </div>
    </div>

    <div class="app-layout">
        <!-- 左侧导航栏 -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h3>事件场景工作流</h3>
            </div>
            <ul class="nav-menu">
                <li><a href="scenario_browser.html" class="nav-item">🎬 仿真推演场景集</a></li>
                <li><a href="case-simulation-center.html" class="nav-item">🔄 场景案例管理</a></li>
                <li><a href="analysis_viewer.html" class="nav-item active">📈 影响分析</a></li>
            </ul>
        </nav>

        <!-- 主内容区域 -->
        <div class="main-content">
            <div class="container">

                <!-- 分析结果单页面布局 -->
                <div id="analysisResultsContainer">

                    <!-- 顶部返回和标题区 -->
                    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px solid #ecf0f1;">
                        <button class="btn btn-secondary" onclick="goBack()" style="padding: 8px 16px;">← 返回</button>
                        <h2 id="analysisTitle" style="margin: 0; flex: 1;">📈 影响分析结果</h2>
                        <span id="caseInfoBadge" style="background: #e3f2fd; color: #1976d2; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;"></span>
                    </div>

                    <!-- 快速统计卡片 -->
                    <div class="metrics-grid" id="summaryMetrics" style="margin-bottom: 35px;">
                        <div class="metric-card">
                            <div class="metric-label">总车辆数</div>
                            <div class="metric-value" id="totalVehicles">--</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">平均行程时间 (分钟)</div>
                            <div class="metric-value" id="avgTripTime">--</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">完成率 (%)</div>
                            <div class="metric-value" id="completionRate">--</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">平均速度 (km/h)</div>
                            <div class="metric-value" id="avgSpeed">--</div>
                        </div>
                    </div>

                    <!-- 对比分析区（主要内容） -->
                    <div style="margin-bottom: 40px;">
                        <h3 style="color: #2c3e50; font-size: 18px; margin-bottom: 15px;">📈 控制策略对比分析</h3>
                        <div id="comparisonTableContainer" style="background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                            <div class="empty-state">加载中...</div>
                        </div>
                    </div>

                    <!-- 策略排名区 -->
                    <div style="margin-bottom: 40px;">
                        <h3 style="color: #2c3e50; font-size: 18px; margin-bottom: 15px;">🏆 策略效果排名</h3>
                        <div id="strategyRankingContainer" style="background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                            <div class="empty-state">加载中...</div>
                        </div>
                    </div>

                    <!-- 仿真详情区 -->
                    <div style="margin-bottom: 40px;">
                        <h3 id="detailTitle" style="color: #2c3e50; font-size: 18px; margin-bottom: 15px;">📋 仿真详情</h3>
                        <table class="comparison-table" id="detailTable" style="background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                            <thead id="detailHeader">
                                <tr>
                                    <th>指标名称</th>
                                    <th>数值</th>
                                    <th>单位</th>
                                    <th>说明</th>
                                </tr>
                            </thead>
                            <tbody id="detailBody">
                                <tr>
                                    <td colspan="4" style="text-align: center; color: #999; padding: 30px;">加载中...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- 底部空白 -->
                    <div style="height: 30px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/event-scenario-comparison.js"></script>
    <script type="module">
        import { APIClient } from '../components/api-client.js';

        const api = new APIClient();
        const urlParams = new URLSearchParams(window.location.search);
        let caseId = urlParams.get('case_id');
        let caseIds = null;  // For multi-case comparison
        let batchId = urlParams.get('batch_id');
        let simulationId = urlParams.get('simulation_id');
        let analysisData = null;

        // Parse case_ids parameter for multi-case comparison (comma-separated)
        const caseIdsParam = urlParams.get('case_ids');
        if (caseIdsParam) {
            caseIds = caseIdsParam.split(',').map(id => id.trim()).filter(id => id);
        }

        /**
         * 返回到案例管理页面
         */
        window.goBack = function() {
            const referrer = sessionStorage.getItem('analysisReferrer') || 'case-simulation-center.html';
            window.location.href = referrer;
        };

        /**
         * 渲染多案例比较摘要和对比表格
         */
        function renderMultiCaseComparison() {
            if (!analysisData || !analysisData.cases) return;

            const summaryContainer = document.getElementById('summaryMetrics');
            summaryContainer.innerHTML = '';

            const cases = analysisData.cases;

            // 更新顶部案例信息徽章
            const caseInfoBadge = document.getElementById('caseInfoBadge');
            if (caseInfoBadge) {
                caseInfoBadge.textContent = `📊 对比分析：${cases.length} 个案例`;
            }

            // 为每个案例创建摘要卡片
            cases.forEach((caseData) => {
                const summary = caseData.summary || {};
                const caseId = caseData.case_id;

                const card = document.createElement('div');
                card.className = 'metric-card';
                card.innerHTML = `
                    <div style="font-weight: 600; margin-bottom: 10px; color: #1976d2;">${caseId}</div>
                    <div class="metric-label">已完成仿真</div>
                    <div class="metric-value">${summary.completed || 0}</div>
                    <div class="metric-label" style="margin-top: 10px;">总仿真数</div>
                    <div class="metric-value">${summary.total_simulations || 0}</div>
                    <div class="metric-label" style="margin-top: 10px;">失败仿真</div>
                    <div class="metric-value" style="color: #f44336;">${summary.failed || 0}</div>
                `;
                summaryContainer.appendChild(card);
            });

            // 渲染对比表格
            renderMultiCaseComparisonTable(cases);
        }

        /**
         * 渲染多案例对比表格
         * 显示各案例的主要指标和改善/恶化情况
         */
        function renderMultiCaseComparisonTable(cases) {
            const container = document.getElementById('comparisonTableContainer');
            if (!container) return;

            if (!cases || cases.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无对比数据</div>';
                return;
            }

            // 基准案例（第一个案例）
            const baseline = cases[0];
            const baselineSummary = baseline.summary || {};

            // 构建表格
            let html = `
                <div class="comparison-table-wrapper">
                    <table class="comparison-table">
                        <thead>
                            <tr>
                                <th>案例 ID</th>
                                <th colspan="2">总仿真数</th>
                                <th colspan="2">已完成</th>
                                <th colspan="2">失败仿真</th>
                                <th colspan="2">完成率 (%)</th>
                            </tr>
                            <tr>
                                <th>案例</th>
                                <th>数值</th>
                                <th>对比</th>
                                <th>数值</th>
                                <th>对比</th>
                                <th>数值</th>
                                <th>对比</th>
                                <th>数值</th>
                                <th>对比</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            // 遍历每个案例
            cases.forEach((caseData, index) => {
                const summary = caseData.summary || {};
                const caseId = caseData.case_id;
                const isBaseline = (index === 0);

                // 计算指标
                const totalSims = summary.total_simulations || 0;
                const completed = summary.completed || 0;
                const failed = summary.failed || 0;
                const completionRate = totalSims > 0 ? ((completed / totalSims) * 100).toFixed(1) : 0;

                // 计算改善百分比（与基准对比）
                let totalSimsChange = '-';
                let completedChange = '-';
                let failedChange = '-';
                let completionRateChange = '-';

                if (!isBaseline) {
                    // 总仿真数对比（更多不一定是好的，但我们显示差异）
                    if (baselineSummary.total_simulations) {
                        const diff = totalSims - baselineSummary.total_simulations;
                        totalSimsChange = diff === 0 ? '→' :
                            `<span class="metric-change ${diff > 0 ? 'positive' : 'negative'}">${diff > 0 ? '↑' : '↓'} ${Math.abs(diff)}</span>`;
                    }

                    // 完成数对比（更多更好）
                    if (baselineSummary.completed) {
                        const diff = completed - baselineSummary.completed;
                        const percentChange = (diff / baselineSummary.completed * 100).toFixed(1);
                        completedChange = diff >= 0 ?
                            `<span class="improvement">↑ +${percentChange}%</span>` :
                            `<span class="deterioration">↓ ${percentChange}%</span>`;
                    }

                    // 失败数对比（更少更好）
                    if (baselineSummary.failed !== undefined) {
                        const diff = failed - baselineSummary.failed;
                        failedChange = diff <= 0 ?
                            `<span class="improvement">↓ ${Math.abs(diff)}</span>` :
                            `<span class="deterioration">↑ ${diff}</span>`;
                    }

                    // 完成率对比（更高更好）
                    const baselineRate = baselineSummary.total_simulations > 0 ?
                        (baselineSummary.completed / baselineSummary.total_simulations * 100) : 0;
                    const rateDiff = completionRate - baselineRate;
                    completionRateChange = rateDiff >= 0 ?
                        `<span class="improvement">↑ +${rateDiff.toFixed(1)}%</span>` :
                        `<span class="deterioration">↓ ${rateDiff.toFixed(1)}%</span>`;
                }

                // 添加表格行
                const rowClass = isBaseline ? 'baseline-row' : '';
                html += `
                    <tr class="${rowClass}">
                        <td class="strategy-name">
                            <strong>${caseId}</strong>
                            ${isBaseline ? '<span class="baseline-badge">基准</span>' : ''}
                        </td>
                        <td class="metric-value">${totalSims}</td>
                        <td class="metric-change">${totalSimsChange}</td>
                        <td class="metric-value">${completed}</td>
                        <td class="metric-change">${completedChange}</td>
                        <td class="metric-value">${failed}</td>
                        <td class="metric-change">${failedChange}</td>
                        <td class="metric-value">${completionRate}</td>
                        <td class="metric-change">${completionRateChange}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>

                <div class="table-legend">
                    <div class="legend-item">
                        <span class="legend-icon improvement">↑</span>
                        <span class="legend-text">改善</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-icon deterioration">↓</span>
                        <span class="legend-text">恶化</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-text">百分比相对于基准案例（第一个选择的案例）</span>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // 渲染仿真详情表格
        function renderSimulationDetails(simulations) {
            const detailBody = document.getElementById('detailBody');
            const detailHeader = document.getElementById('detailHeader');
            const detailTitle = document.getElementById('detailTitle');

            if (!detailBody) return;

            // 更新标题和表头（仅在批量模式下）
            if (caseId) {
                detailTitle.textContent = '📋 仿真列表';
                if (detailHeader) {
                    detailHeader.innerHTML = `
                        <tr>
                            <th>#</th>
                            <th>仿真ID</th>
                            <th>状态</th>
                            <th>进度</th>
                            <th>耗时</th>
                        </tr>
                    `;
                }
            }

            // 清空现有内容
            detailBody.innerHTML = '';

            if (!simulations || simulations.length === 0) {
                detailBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999;">暂无仿真数据</td></tr>';
                return;
            }

            // 创建行
            simulations.forEach((sim, idx) => {
                const row = document.createElement('tr');
                const statusClass = sim.status === 'completed' ? 'positive' : (sim.status === 'failed' ? 'negative' : '');
                const statusText = {
                    'completed': '已完成',
                    'running': '运行中',
                    'simulating': '仿真中',
                    'failed': '失败',
                    'queued': '排队中'
                }[sim.status] || sim.status;

                row.innerHTML = `
                    <td>${idx + 1}</td>
                    <td>${sim.simulation_id || '--'}</td>
                    <td><span class="badge ${statusClass}">${statusText}</span></td>
                    <td>${(sim.progress_percent || 0)}%</td>
                    <td>${sim.elapsed_seconds ? sim.elapsed_seconds.toFixed(1) + 's' : '--'}</td>
                `;
                detailBody.appendChild(row);
            });
        }

        /**
         * 加载多案例的分析数据并合并
         */
        async function loadComparisonData(caseIdsArray) {
            const analyses = [];

            for (const id of caseIdsArray) {
                try {
                    const response = await api.request(`/analysis/results/${id}?case_id=${id}`);
                    const data = response.data || response;
                    analyses.push({ case_id: id, ...data });
                    console.log(`加载案例 ${id} 的分析结果成功`);
                } catch (error) {
                    console.warn(`加载案例 ${id} 的分析结果失败: ${error.message}`);
                    // 使用备选方案获取基本信息
                    try {
                        const progressResponse = await api.request(`/simulation/simulation_progress/${id}`);
                        const progressData = progressResponse.data || progressResponse;
                        analyses.push({
                            case_id: id,
                            summary: {
                                case_id: id,
                                total_simulations: progressData.simulations?.length || 0,
                                completed: progressData.simulations?.filter(s => s.status === 'completed').length || 0,
                                failed: progressData.simulations?.filter(s => s.status === 'failed').length || 0
                            },
                            simulations: progressData.simulations || []
                        });
                    } catch (fallbackError) {
                        console.error(`案例 ${id} 完全加载失败:`, fallbackError);
                    }
                }
            }

            return analyses;
        }

        /**
         * 合并多个案例的分析数据用于对比
         */
        function mergeComparisonAnalyses(analysesArray) {
            if (!analysesArray || analysesArray.length === 0) return null;

            // 对于比较分析，保持原有的结构，但标记为多案例模式
            return {
                is_multi_case: true,
                cases: analysesArray,
                case_ids: analysesArray.map(a => a.case_id),
                // 组合摘要数据
                summary: {
                    total_cases: analysesArray.length,
                    completed_cases: analysesArray.filter(a => a.summary?.completed > 0).length
                }
            };
        }

        // 加载分析结果
        async function loadAnalysisResults() {
            try {
                // 优先使用 case_ids (用于多案例比较)
                if (caseIds && caseIds.length > 0) {
                    console.log(`加载多案例比较数据: ${caseIds.join(', ')}`);
                    const comparisonAnalyses = await loadComparisonData(caseIds);
                    analysisData = mergeComparisonAnalyses(comparisonAnalyses);
                    console.log('多案例比较数据:', analysisData);
                }
                // 其次使用 case_id (用于批量分析结果)
                else if (caseId) {
                    // 使用 case_id 加载批量分析结果
                    // 如果有 batch_id，使用具体的批次ID；否则使用 case_id 作为批次标识
                    const batchIdentifier = batchId || caseId;

                    console.log(`加载批量分析结果: case_id=${caseId}, batch_id=${batchIdentifier}`);

                    try {
                        const response = await api.request(`/analysis/results/${batchIdentifier}?case_id=${caseId}`);
                        analysisData = response.data || response;
                        console.log('批量分析结果:', analysisData);
                    } catch (error) {
                        console.warn(`加载分析结果失败: ${error.message}`);
                        // 尝试从 simulation_progress 获取仿真列表作为备选
                        const progressResponse = await api.request(`/simulation/simulation_progress/${caseId}`);
                        const progressData = progressResponse.data || progressResponse;

                        // 构建最小的分析数据对象
                        analysisData = {
                            summary: {
                                case_id: caseId,
                                batch_id: batchIdentifier,
                                total_simulations: progressData.simulations?.length || 0,
                                completed: progressData.simulations?.filter(s => s.status === 'completed').length || 0,
                                failed: progressData.simulations?.filter(s => s.status === 'failed').length || 0
                            },
                            simulations: progressData.simulations || []
                        };
                    }
                } else if (batchId) {
                    const response = await api.request(`/analysis/results/${batchId}`);
                    analysisData = response.data || response;
                } else if (simulationId) {
                    // 加载单个仿真的分析结果
                    analysisData = {};
                }

                renderResults();
            } catch (error) {
                console.error('加载分析结果失败:', error);
                document.getElementById('summaryMetrics').innerHTML =
                    '<div class="no-data">加载失败，请重试</div>';
            }
        }

        // 渲染结果
        function renderResults() {
            if (!analysisData) return;

            // 处理多案例比较模式
            if (analysisData.is_multi_case) {
                renderMultiCaseComparison();
                return;
            }

            // 概览数据 - 支持两种格式：单仿真和批量仿真
            if (analysisData.summary) {
                const summary = analysisData.summary;

                // 如果是批量仿真结果 (case_id 模式)
                if (caseId && summary.case_id) {
                    // 渲染批量仿真统计
                    document.getElementById('totalVehicles').textContent = summary.total_simulations || '--';
                    document.getElementById('avgTripTime').textContent = summary.completed ? summary.completed : '--';
                    document.getElementById('completionRate').textContent = summary.failed || 0;
                    document.getElementById('avgSpeed').textContent = (summary.total_simulations ? ((summary.completed / summary.total_simulations) * 100).toFixed(1) : 0) + '%';

                    // 更新统计标签
                    document.querySelectorAll('.metric-label')[0].textContent = '总仿真数';
                    document.querySelectorAll('.metric-label')[1].textContent = '已完成仿真';
                    document.querySelectorAll('.metric-label')[2].textContent = '失败仿真';
                    document.querySelectorAll('.metric-label')[3].textContent = '完成率';

                    // 渲染仿真详情表格
                    if (analysisData.simulations && Array.isArray(analysisData.simulations)) {
                        renderSimulationDetails(analysisData.simulations);
                    }
                } else {
                    // 单仿真结果格式
                    document.getElementById('totalVehicles').textContent = summary.total_vehicles || '--';
                    document.getElementById('avgTripTime').textContent = (summary.avg_trip_time || 0).toFixed(1);
                    document.getElementById('completionRate').textContent = (summary.completion_rate || 0).toFixed(1);
                    document.getElementById('avgSpeed').textContent = (summary.avg_speed || 0).toFixed(1);
                }
            }

            // EdgeData数据
            if (analysisData.edgedata) {
                const edgedata = analysisData.edgedata;
                const edgeList = document.getElementById('edgeList');
                edgeList.innerHTML = '';

                if (edgedata.most_congested_edges && edgedata.most_congested_edges.length > 0) {
                    edgedata.most_congested_edges.slice(0, 10).forEach((edge, idx) => {
                        const speed = edge.avg_speed || 0;
                        const maxSpeed = 100; // 参考速度
                        const percentage = Math.min((speed / maxSpeed) * 100, 100);

                        const item = document.createElement('div');
                        item.className = 'edge-item';
                        item.innerHTML = `
                            <div class="edge-name">${idx + 1}. ${edge.edge_id}</div>
                            <div class="edge-bar">
                                <div class="edge-bar-fill" style="width: ${percentage}%;"></div>
                            </div>
                            <div class="edge-value">${speed.toFixed(1)} km/h</div>
                        `;
                        edgeList.appendChild(item);
                    });
                } else {
                    edgeList.innerHTML = '<div class="no-data">暂无数据</div>';
                }
            }

            // 对比数据 - 使用新的对比表格组件
            if (analysisData.strategy_comparison || analysisData.comparison) {
                // 如果有新格式的数据（strategy_comparison），使用新组件
                if (analysisData.strategy_comparison) {
                    renderEventScenarioComparisonTable(analysisData, 'comparisonTableContainer');

                    if (analysisData.strategy_ranking) {
                        renderStrategyRanking(analysisData, 'strategyRankingContainer');
                    }
                } else {
                    // 向后兼容：旧格式数据
                    console.warn('使用旧格式的对比数据，建议更新后端返回新格式');
                    const container = document.getElementById('comparisonTableContainer');
                    container.innerHTML = '<div class="empty-state">数据格式不兼容，请联系管理员更新</div>';
                }
            }
        }



        // 页面加载
        loadAnalysisResults();
    </script>
</body>
</html>
